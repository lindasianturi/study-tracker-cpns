<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Observer Desk – Blibli Excellent Academy Program</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230a5ccf'/%3E%3Cpath d='M6 24C11 15 17 11 24 11s13 4 18 13c-5 9-11 13-18 13S11 33 6 24Z' fill='%23fff'/%3E%3Ccircle cx='24' cy='24' r='8.5' fill='%230a5ccf'/%3E%3Cpath d='M19.5 24.5l3.3 3.3 6-6.6' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#14213d;--mut:#64708a;--bd:#e1e6f0;--pri:#0a5ccf;--pri2:#e6f0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1523;--card:#182033;--tx:#e8edf8;--mut:#93a0ba;--bd:#2a3550;--pri:#5b9bff;--pri2:#1f2f50;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1523;--card:#182033;--tx:#e8edf8;--mut:#93a0ba;--bd:#2a3550;--pri:#5b9bff;--pri2:#1f2f50;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--bd);background:var(--card);display:flex;align-items:center;gap:12px}header svg{flex:none}
h1{font-size:18px;margin:0}header p{margin:2px 0 0;color:var(--mut);font-size:13px}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:16px;padding:16px 20px;max-width:1150px;margin:0 auto}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
input,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
textarea{min-height:80px;resize:vertical}
button{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd)}
.add{display:flex;gap:6px;margin-bottom:10px}.add button{white-space:nowrap}
.tr{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.tr:hover{background:var(--pri2)}.tr.on{background:var(--pri2);border-color:var(--pri)}
.tr b{font-weight:600}.tr small{color:var(--mut);display:block}.sc{font-weight:700;font-size:16px}
.nm{display:flex;gap:8px;margin-bottom:12px}.nm input{font-size:17px;font-weight:600}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.stat{background:var(--pri2);border-radius:10px;padding:10px 12px}.stat span{font-size:12px;color:var(--mut)}.stat div{font-size:24px;font-weight:700}.stat small{color:var(--mut);font-size:13px;font-weight:400}
.p{border-top:1px solid var(--bd);padding:12px 0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ph .n{display:flex;align-items:center;gap:6px}.ph .n input{width:80px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--bd);background:transparent;color:var(--mut);border-radius:20px;padding:3px 10px;font-size:12px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.desc{font-size:13px;color:var(--mut);background:var(--bg);border-radius:8px;padding:8px 10px}
input[type=range]{width:100%;accent-color:var(--pri)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{background:transparent;color:var(--mut);border:1px solid var(--bd)}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.ss{border-top:1px solid var(--bd);padding:12px 0}.ss .r{display:grid;grid-template-columns:110px 1fr auto;gap:6px;margin-bottom:6px}
.scr{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px;font-size:12.5px}th,td{border:1px solid var(--bd);padding:7px 8px;text-align:left;vertical-align:top}th{background:var(--pri2)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.gr .card{margin:0}.gr svg{width:100%;height:auto}
.empty{color:var(--mut);text-align:center;padding:30px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.md{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}.md h3{margin:0 0 10px;font-size:16px}.md p{margin:0;color:var(--mut)}.md label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}.mb{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}button.dg{background:#c62828}
</style>
</head>
<body>
<header><svg width="44" height="44" viewBox="0 0 48 48" role="img" aria-label="Logo Observer Desk"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2d8cff"/><stop offset="1" stop-color="#0a4bb0"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#lg)"/><path d="M6 24C11 15 17 11 24 11s13 4 18 13c-5 9-11 13-18 13S11 33 6 24Z" fill="#fff"/><circle cx="24" cy="24" r="8.5" fill="#0a5ccf"/><path d="M19.5 24.5l3.3 3.3 6-6.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M39 5l1.3 3.2L43.5 9.5l-3.2 1.3L39 14l-1.3-3.2L34.5 9.5l3.2-1.3z" fill="#ffc933"/></svg><div><h1>Observer Desk · Blibli Excellent Academy Program</h1><p>Lembar observasi peserta training (5 hari). Data tersimpan otomatis di browser ini.</p></div></header>
<div class="wrap">
 <aside><div class="card"><h2>Peserta</h2>
  <div class="add"><input type="text" id="nm" placeholder="Nama peserta"><button id="ad">Tambah</button></div>
  <div id="list"></div></div></aside>
 <main>
  <div class="tabs"><button id="t1">Penilaian</button><button id="t2">Rubrik</button><button id="t3">Rekap Semua Hari</button><button id="t4">Rekap per Hari</button></div>
  <div id="v"></div>
 </main>
</div>
<script>
const MAX=100,ND=5;
const BANDS=[["Sangat Kurang",0,20],["Kurang",21,40],["Cukup",41,60],["Baik",61,80],["Sangat Baik",81,100]];
const PARAMS=[
{n:"Kehadiran Tepat Waktu",d:["Sering terlambat atau tidak hadir tanpa kabar; kerap melewatkan sesi.","Terlambat cukup sering dan alasan kurang jelas; konfirmasi kehadiran tidak konsisten.","Hadir pada sebagian besar sesi, sesekali terlambat dengan konfirmasi.","Hampir selalu hadir dan tepat waktu; bila berhalangan memberi kabar lebih dulu.","Selalu hadir sebelum sesi dimulai, tidak pernah terlambat, siap sebelum mulai."]},
{n:"Kerapihan",d:["Penampilan dan perlengkapan tidak sesuai ketentuan; area kerja berantakan.","Sering kurang rapi atau tidak sesuai dresscode; perlu diingatkan berulang.","Cukup rapi dan sesuai ketentuan, sesekali ada yang terlewat.","Rapi dan sesuai dresscode; perlengkapan dan area kerja tertata.","Selalu sangat rapi dan profesional; menjadi contoh bagi peserta lain."]},
{n:"Keaktifan",d:["Pasif; tidak berpartisipasi dalam diskusi atau aktivitas, harus selalu ditunjuk.","Jarang berpartisipasi; hanya ikut bila diminta.","Berpartisipasi cukup, ikut aktivitas namun belum berinisiatif.","Aktif berdiskusi dan mengikuti aktivitas, sering berinisiatif.","Sangat proaktif; memimpin diskusi, memberi ide, dan menghidupkan kelas."]},
{n:"Sikap selama Training",d:["Tidak sopan atau mengganggu jalannya sesi; sibuk dengan gawai.","Kurang menghargai trainer dan peserta; fokus sering teralihkan.","Cukup sopan dan fokus, kadang perlu diingatkan.","Sopan, fokus, kooperatif, dan menghargai pendapat orang lain.","Sangat profesional, penuh antusias, mudah bekerja sama, menjadi teladan sikap."]},
{n:"Menjawab Pertanyaan",d:["Tidak mampu atau tidak mau menjawab; jawaban tidak relevan.","Jawaban kurang tepat, tidak runtut, dan butuh banyak arahan.","Jawaban cukup relevan namun kurang mendalam atau kurang jelas.","Jawaban tepat, runtut, dan disertai alasan atau contoh.","Jawaban sangat tepat, kritis, terstruktur, dan memberi wawasan tambahan."]}];
const KEY="beap_observer_v3";
const mkSess=d=>[1,2,3,4].map(n=>({id:"d"+d+"s"+n,name:"Sesi "+n,materi:""}));
const mk=name=>({id:"t"+Date.now()+Math.random().toString(36).slice(2,6),name,days:Array.from({length:ND},()=>({s:[null,null,null,null,null],notes:{}}))});
let S={trainees:[],sessions:Array.from({length:ND},(_,d)=>mkSess(d)),sel:null,tab:1,day:0,rday:0};
try{const r=localStorage.getItem(KEY);if(r)Object.assign(S,JSON.parse(r));else{const o=JSON.parse(localStorage.getItem("beap_observer_v2")||"null");if(o&&o.trainees)S.trainees=o.trainees.map(x=>{const t=mk(x.name);t.days[0].s=x.s;if(x.note)t.days[0].notes.d0s1=x.note;return t})}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const band=v=>BANDS.findIndex(b=>v>=b[1]&&v<=b[2]);
const tot=(t,d)=>t.days[d].s.reduce((a,x)=>a+(x||0),0);
const dn=(t,d)=>t.days[d].s.filter(x=>x!==null).length;
const dAvg=(t,d)=>dn(t,d)?tot(t,d)/5:null;
const all=t=>{const v=t.days.map((_,d)=>dAvg(t,d)).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
const pred=f=>f===null||f<=0?"-":BANDS[Math.min(4,Math.ceil(f/20)-1)][0];
const fmt=v=>v===null?"–":v.toFixed(1);
const PC=[["#d32f2f","#fff"],["#f57c00","#fff"],["#fdd835","#3a3000"],["#8bc34a","#14300a"],["#2e9d57","#fff"]];
const pill=f=>{const p=pred(f);if(p==="-")return"-";const k=BANDS.findIndex(b=>b[0]===p);return`<span style="background:${PC[k][0]};color:${PC[k][1]};padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;display:inline-block">${p}</span>`};
const cur=()=>S.trainees.find(t=>t.id===S.sel);
function list(){
 $("list").innerHTML=S.trainees.length?S.trainees.map(t=>`<div class="tr ${t.id===S.sel?"on":""}" data-id="${t.id}"><div><b>${esc(t.name)}</b><small>${pill(all(t))}</small></div><div class="sc">${fmt(all(t))}</div></div>`).join(""):'<div class="empty">Belum ada peserta.</div>';
 document.querySelectorAll(".tr").forEach(e=>e.onclick=()=>{S.sel=e.dataset.id;S.tab=1;save();render()});
}
function modal(o){
 const ov=document.createElement("div");ov.className="ov";
 ov.innerHTML=`<div class="md" role="dialog" aria-modal="true"><h3>${o.title}</h3>${o.body||""}<div class="mb"><button class="ghost" data-x>Batal</button><button data-ok class="${o.danger?"dg":""}">${o.ok||"Simpan"}</button></div></div>`;
 const close=()=>{ov.remove();document.removeEventListener("keydown",kd)};
 const ok=()=>{if(o.onOk(ov)!==false)close()};
 const kd=e=>{if(e.key==="Escape")close();else if(e.key==="Enter"&&e.target.tagName!=="TEXTAREA"&&e.target.tagName!=="BUTTON")ok()};
 ov.querySelector("[data-x]").onclick=close;ov.querySelector("[data-ok]").onclick=ok;
 ov.onclick=e=>{if(e.target===ov)close()};
 document.addEventListener("keydown",kd);document.body.appendChild(ov);
 if(o.init)o.init(ov);const f=ov.querySelector("input,textarea");if(f){f.focus();if(f.select)f.select()}
}
function viewScore(){
 const t=cur();
 if(!t)return'<div class="card empty">Tambahkan atau pilih peserta untuk mulai menilai.</div>';
 const d=S.day,dd=t.days[d],T=tot(t,d),av=dAvg(t,d);
 let h=`<div class="card"><div class="nm"><b style="font-size:18px;flex:1">${esc(t.name)}</b><button class="ghost" id="ren">Ubah nama</button><button class="ghost" id="del">Hapus</button></div>
 <div class="tabs">${S.sessions.map((_,i)=>`<button class="dt ${i===d?"on":""}" data-d="${i}">Hari ${i+1}</button>`).join("")}<button class="ghost" id="rst" style="margin-left:auto">Reset penilaian Hari ${d+1}</button></div>
 <div class="sum"><div class="stat"><span>Total Hari ${d+1}</span><div>${T}<small> / 500</small></div></div>
 <div class="stat"><span>Rata-rata hari ini (÷ 5)</span><div>${fmt(av)}<small> / 100</small></div></div>
 <div class="stat"><span>Predikat hari ini</span><div style="font-size:18px;padding:5px 0">${pill(av)}</div></div>
 <div class="stat"><span>Rata-rata keseluruhan</span><div>${fmt(all(t))}<small> / 100</small></div></div></div>`;
 PARAMS.forEach((p,i)=>{
  const v=dd.s[i],b=v===null?-1:band(v);
  h+=`<div class="p"><div class="ph"><b>${i+1}. ${p.n}</b><div class="n"><input type="number" min="0" max="${MAX}" value="${v===null?"":v}" placeholder="–" data-i="${i}" class="num"><span>/ ${MAX}</span></div></div>
  <input type="range" min="0" max="${MAX}" value="${v||0}" data-i="${i}" class="rng">
  <div class="chips">${BANDS.map((x,k)=>`<button class="chip ${k===b?"on":""}" data-i="${i}" data-k="${k}">${x[0]} (${x[1]}–${x[2]})</button>`).join("")}</div>
  <div class="desc">${b<0?"Belum dinilai. Isi angka, geser slider, atau pilih kategori.":"<b>"+BANDS[b][0]+" ("+BANDS[b][1]+"–"+BANDS[b][2]+"):</b> "+p.d[b]}</div></div>`;
 });
 h+=`</div><div class="card"><div class="ph"><h2 style="margin:0">Catatan sesi · Hari ${d+1}</h2><button class="ghost" id="adds">+ Tambah sesi</button></div>
 <p class="desc" style="margin:8px 0 0">Nama sesi dan judul materi berlaku untuk semua peserta di hari ini; catatan khusus untuk ${esc(t.name)}.</p>`;
 S.sessions[d].forEach((s,k)=>{
  const n=dd.notes[s.id];
  h+=`<div class="ss"><div class="ph"><div><b>${esc(s.name)}</b>${s.materi?" · "+esc(s.materi):' <span style="color:var(--mut)">(belum ada judul materi)</span>'}</div><div><button class="ghost es" data-k="${k}">Ubah sesi</button> <button class="ghost dels" data-k="${k}">Hapus</button></div></div>
  <div class="desc" style="white-space:pre-wrap;margin:8px 0">${n?esc(n):"Belum ada catatan."}</div><button class="ghost en" data-id="${s.id}">${n?"Edit catatan":"Tambah catatan"}</button></div>`;
 });
 return h+"</div>";
}
function viewRubric(){
 let h=`<div class="card"><h2>Rubrik penilaian (tiap parameter maks 100, total maks 500)</h2><div class="scr"><table style="min-width:760px"><tr><th>Parameter</th>${BANDS.map(b=>`<th>${b[0]}<br>${b[1]}–${b[2]}</th>`).join("")}</tr>`;
 PARAMS.forEach(p=>{h+=`<tr><th>${p.n}</th>${p.d.map(x=>`<td>${x}</td>`).join("")}</tr>`});
 return h+`</table></div><p class="desc" style="margin-top:12px">Total harian = jumlah 5 parameter (maks 500). Rata-rata harian = total ÷ 5 (maks 100). Rata-rata keseluruhan = rata-rata dari hari yang sudah dinilai.</p></div>`;
}
function chart(vals,lb){
 const W=300,H=170,l=28,b=22,tp=14,h=H-b-tp,bw=(W-l-8)/vals.length;let g="";
 [0,20,40,60,80,100].forEach(y=>{const yy=tp+h-y/100*h;g+=`<line x1="${l}" x2="${W-8}" y1="${yy}" y2="${yy}" style="stroke:var(--bd)"/><text x="${l-4}" y="${yy+3}" text-anchor="end" font-size="9" style="fill:var(--mut)">${y}</text>`});
 vals.forEach((v,i)=>{const x=l+i*bw+bw*.18,w=bw*.64,c=x+w/2;
  if(v!==null){const bh=v/100*h;g+=`<rect x="${x}" y="${tp+h-bh}" width="${w}" height="${bh}" rx="3" style="fill:var(--pri)"/><text x="${c}" y="${tp+h-bh-3}" text-anchor="middle" font-size="10" font-weight="700" style="fill:var(--tx)">${v.toFixed(1)}</text>`}
  g+=`<text x="${c}" y="${H-7}" text-anchor="middle" font-size="10" style="fill:var(--mut)">${lb?lb[i]:"Hari "+(i+1)}</text>`});
 return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik nilai per hari">${g}</svg>`;
}
function viewRekap(){
 if(!S.trainees.length)return'<div class="card empty">Belum ada data.</div>';
 const rows=[...S.trainees].sort((a,b)=>(all(b)||0)-(all(a)||0));
 return`<div class="card"><h2>Rekap rata-rata per hari (urut nilai tertinggi)</h2><div class="scr"><table><tr><th>#</th><th>Nama</th>${S.sessions.map((_,i)=>`<th>Hari ${i+1}</th>`).join("")}<th>Rata-rata</th><th>Predikat</th></tr>${rows.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.name)}</td>${t.days.map((_,d)=>`<td>${fmt(dAvg(t,d))}</td>`).join("")}<td><b>${fmt(all(t))}</b></td><td>${pill(all(t))}</td></tr>`).join("")}</table></div></div>
 <div class="gr">${rows.map(t=>`<div class="card"><div class="ph"><b>${esc(t.name)}</b><span class="sc">${fmt(all(t))}</span></div>${chart(t.days.map((_,d)=>dAvg(t,d)))}</div>`).join("")}</div>`;
}
function viewRekapDay(){
 if(!S.trainees.length)return'<div class="card empty">Belum ada data.</div>';
 const d=S.rday,rows=[...S.trainees].sort((a,b)=>(dAvg(b,d)||0)-(dAvg(a,d)||0)),lb=["Hadir","Rapi","Aktif","Sikap","Jawab"];
 return`<div class="tabs">${S.sessions.map((_,i)=>`<button class="rd ${i===d?"on":""}" data-d="${i}">Hari ${i+1}</button>`).join("")}</div>
 <div class="card"><h2>Rekap Hari ${d+1} (nilai per kategori, urut nilai tertinggi)</h2><div class="scr"><table style="min-width:720px"><tr><th>#</th><th>Nama</th>${PARAMS.map(p=>`<th>${p.n}</th>`).join("")}<th>Total (maks 500)</th><th>Rata-rata</th><th>Predikat</th></tr>${rows.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.name)}</td>${t.days[d].s.map(x=>`<td>${x===null?"–":x}</td>`).join("")}<td>${tot(t,d)}</td><td><b>${fmt(dAvg(t,d))}</b></td><td>${pill(dAvg(t,d))}</td></tr>`).join("")}</table></div></div>
 <div class="gr">${rows.map(t=>`<div class="card"><div class="ph"><b>${esc(t.name)}</b><span class="sc">${fmt(dAvg(t,d))}</span></div>${chart(t.days[d].s,lb)}</div>`).join("")}</div>`;
}
function render(){
 [1,2,3,4].forEach(i=>$("t"+i).classList.toggle("on",S.tab===i));
 $("v").innerHTML=S.tab===1?viewScore():S.tab===2?viewRubric():S.tab===3?viewRekap():viewRekapDay();
 list();
 document.querySelectorAll(".rd").forEach(e=>e.onclick=()=>{S.rday=+e.dataset.d;save();render()});
 const t=cur();
 if(S.tab!==1||!t)return;
 const dd=t.days[S.day],ss=S.sessions[S.day];
 document.querySelectorAll(".dt").forEach(e=>e.onclick=()=>{S.day=+e.dataset.d;save();render()});
 const set=(i,v)=>{dd.s[i]=v===""?null:Math.max(0,Math.min(MAX,Math.round(+v)));save();render()};
 document.querySelectorAll(".num,.rng").forEach(e=>e.onchange=()=>set(+e.dataset.i,e.value));
 document.querySelectorAll(".chip").forEach(e=>e.onclick=()=>{const b=BANDS[+e.dataset.k];set(+e.dataset.i,Math.round((b[1]+b[2])/2))});
 document.querySelectorAll(".ev").forEach(e=>e.onclick=()=>{const i=+e.dataset.i,v=dd.s[i];
  modal({title:PARAMS[i].n+" · Hari "+(S.day+1),body:`<label>Nilai (0–${MAX})</label><input type="number" id="mv" min="0" max="${MAX}" value="${v===null?"":v}"><input type="range" id="mr" min="0" max="${MAX}" value="${v||0}" style="margin-top:8px"><div class="chips">${BANDS.map((x,k)=>`<button type="button" class="chip" data-k="${k}">${x[0]} (${x[1]}–${x[2]})</button>`).join("")}</div>`,
  init:m=>{const n=m.querySelector("#mv"),r=m.querySelector("#mr");n.oninput=()=>{r.value=n.value||0};r.oninput=()=>{n.value=r.value};m.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const b=BANDS[+c.dataset.k];n.value=r.value=Math.round((b[1]+b[2])/2)})},
  onOk:m=>{const x=m.querySelector("#mv").value;dd.s[i]=x===""?null:Math.max(0,Math.min(MAX,Math.round(+x)));save();render()}})});
 $("rst").onclick=()=>modal({title:"Reset penilaian Hari "+(S.day+1)+"?",body:`<p>Kelima nilai ${esc(t.name)} di Hari ${S.day+1} akan dikosongkan. Tindakan ini tidak bisa dibatalkan.</p><label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="rn" style="width:auto"> Hapus juga catatan sesi hari ini</label>`,ok:"Reset",danger:1,onOk:m=>{dd.s=[null,null,null,null,null];if(m.querySelector("#rn").checked)dd.notes={};save();render()}});
 $("ren").onclick=()=>modal({title:"Ubah nama peserta",body:`<label>Nama</label><input type="text" id="mn" value="${esc(t.name)}">`,onOk:m=>{const n=m.querySelector("#mn").value.trim();if(!n)return false;t.name=n;save();render()}});
 $("del").onclick=()=>modal({title:"Hapus peserta?",body:`<p>${esc(t.name)} beserta semua nilai dan catatannya akan dihapus. Tindakan ini tidak bisa dibatalkan.</p>`,ok:"Hapus",danger:1,onOk:()=>{S.trainees=S.trainees.filter(x=>x!==t);S.sel=S.trainees[0]?.id||null;save();render()}});
 document.querySelectorAll(".es").forEach(e=>e.onclick=()=>{const s=ss[+e.dataset.k];
  modal({title:"Ubah sesi",body:`<label>Nama sesi</label><input type="text" id="sn" value="${esc(s.name)}"><label>Judul materi</label><input type="text" id="sm" value="${esc(s.materi)}">`,onOk:m=>{s.name=m.querySelector("#sn").value.trim()||s.name;s.materi=m.querySelector("#sm").value.trim();save();render()}})});
 document.querySelectorAll(".dels").forEach(e=>e.onclick=()=>{const k=+e.dataset.k;
  modal({title:"Hapus sesi?",body:`<p>${esc(ss[k].name)} akan dihapus untuk semua peserta di Hari ${S.day+1}, termasuk catatannya. Tindakan ini tidak bisa dibatalkan.</p>`,ok:"Hapus",danger:1,onOk:()=>{ss.splice(k,1);save();render()}})});
 document.querySelectorAll(".en").forEach(e=>e.onclick=()=>{const id=e.dataset.id;
  modal({title:"Catatan sesi",body:`<label>Catatan untuk ${esc(t.name)}</label><textarea id="mt" style="min-height:140px">${esc(dd.notes[id])}</textarea>`,onOk:m=>{dd.notes[id]=m.querySelector("#mt").value;save();render()}})});
 $("adds").onclick=()=>{ss.push({id:"x"+Date.now(),name:"Sesi "+(ss.length+1),materi:""});save();render()};
}
function add(){const n=$("nm").value.trim();if(!n)return;const t=mk(n);S.trainees.push(t);S.sel=t.id;S.tab=1;$("nm").value="";save();render()}
$("ad").onclick=add;$("nm").onkeydown=e=>{if(e.key==="Enter")add()};
[1,2,3,4].forEach(i=>$("t"+i).onclick=()=>{S.tab=i;render()});
if(!cur())S.sel=S.trainees[0]?.id||null;
render();
</script>
</body>
</html>
